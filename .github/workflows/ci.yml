name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: check, format and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      - name: Update dependencies
        run: moon update

      - name: Check (warnings are errors)
        run: moon check --target native --deny-warn

      # `moon fmt` chooses its canonical backend itself and formats for
      # wasm-gc regardless of `preferred_target`, which the module sets to
      # native. The formatter therefore rewrites `Int` to `Int32` — including
      # in packages marked `supported_targets = "+native"` — and a hard gate
      # would fail on a difference that is not this project's to fix. Nor can
      # the toolchain be pinned around it: the installer serves only `latest`
      # and older versions are dropped from the CDN. So report, do not block;
      # `--deny-warn` and the tests below are the gates that do block.
      - name: Format check (advisory)
        run: |
          if moon fmt --check; then
            echo "::notice title=moon fmt::no formatting differences"
          else
            echo "::warning title=moon fmt::differences reported above; not failing the build"
          fi

      - name: Test
        run: moon test --target native

      # Release mode is a different code path; build it here so a tag is not
      # the first place it is tried.
      - name: Build (native, release)
        run: moon build --target native --release

  # The same release build the Windows artifact uses, so a tag is not the
  # first time the MSVC toolchain path is exercised.
  windows:
    name: build on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Show toolchain
        run: moon version --all

      - name: Update dependencies
        run: moon update

      - name: Check (warnings are errors)
        run: moon check --target native --deny-warn

      - name: Build (native, release)
        run: moon build --target native --release

      - name: Smoke test
        shell: bash
        run: |
          set -eu
          ./_build/native/release/build/cmd/shrc/shrc.exe version
          ./_build/native/release/build/cmd/shrc/shrc.exe help >/dev/null

  shellcheck:
    name: lint install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck install.sh

  npm:
    name: lint the npm wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Check every script the package ships, so adding one cannot silently
      # leave the check pointing at a file that no longer exists.
      - name: Syntax check
        run: |
          set -eu
          find npmjs -name '*.js' -not -path '*/node_modules/*' -print0 |
            while IFS= read -r -d '' script; do
              echo "node --check $script"
              node --check "$script"
            done
      - name: Unit tests
        working-directory: npmjs
        run: node --test

      # The published files are listed in package.json; fail here rather than
      # at publish time if one of them is missing.
      - name: Verify the published tarball
        working-directory: npmjs
        run: npm pack --dry-run

      # Drive the launcher without downloading anything: SHRC_BINARY makes it
      # run the binary it is pointed at, so argument and exit-code forwarding
      # is checked end to end.
      - name: Launcher smoke test
        working-directory: npmjs
        run: |
          set -eu
          test "$(SHRC_BINARY=/bin/echo node bin/shrc.js hello)" = "hello"
          if SHRC_BINARY=/bin/false node bin/shrc.js; then
            echo "::error::the launcher must forward a non-zero exit code"
            exit 1
          fi
